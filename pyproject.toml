[project]
name = "sabah-atlas"
version = "0.1.0"
description = "Atlas Ekonomi Sabah — workspace root"
requires-python = ">=3.12"
dependencies = [
    "atlas-core",
    "atlas-pipelines",
    "atlas-ml",
    "atlas-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
    "playwright>=1.63.0",
    "pillow>=12.3.0",
]

[tool.uv.workspace]
members = ["packages/core", "pipelines", "ml", "apps/api"]

[tool.uv.sources]
atlas-core = { workspace = true }
atlas-pipelines = { workspace = true }
atlas-ml = { workspace = true }
atlas-api = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"pipelines/scripts/*" = ["B905", "F841"]
"pipelines/src/atlas_pipelines/cli_app.py" = ["B008"]
# Long SQL, prompt and fact-label strings read better unwrapped.
"apps/api/src/atlas_api/analyst/*" = ["E501"]
"apps/api/src/atlas_api/analyst_routes.py" = ["E501"]
"pipelines/src/atlas_pipelines/corpus.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlas_core", "atlas_pipelines", "atlas_ml", "atlas_api"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "pipelines/tests", "ml/tests", "apps/api/tests"]
addopts = "-q"
