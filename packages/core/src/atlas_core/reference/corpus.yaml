# Tier-3 document corpus for Atlas Ekonomi Sabah.
#
# These are full public documents (mostly PDF) retrieved and cited by page
# and URL by the AI Analyst, as distinct from the Tier-1 structured datasets
# in sources.yaml. Every `url` below was checked with
#   curl -sIL -A "Mozilla/5.0" --max-time 30 <url>
# and returned HTTP 200 with a pdf/html content-type on the `verified` date.
# Do not add an entry without doing the same. Malay-language documents are
# tagged language: ms; documents that mix Malay and English (most DOSM
# releases) are tagged mixed.
#
# Fields: id, title, publisher, published, url, kind, language, licence,
# topics, verified, notes.

