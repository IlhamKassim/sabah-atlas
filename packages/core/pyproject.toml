[project]
name = "atlas-core"
version = "0.1.0"
description = "Canonical district registry, indicator catalogue and shared settings"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fsspec>=2024.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_core"]
