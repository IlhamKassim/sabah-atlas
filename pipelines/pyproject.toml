[project]
name = "atlas-pipelines"
version = "0.1.0"
description = "Ingest, harmonise and publish gold tables for Atlas Ekonomi Sabah"
requires-python = ">=3.12"
dependencies = [
    "atlas-core",
    "httpx>=0.28",
    "pandera>=0.21",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.16",
    "typer>=0.13",
    "pypdf>=6.19.0",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
atlas = "atlas_pipelines.cli_app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_pipelines"]
