[project]
name = "atlas-ml"
version = "0.1.0"
description = "Scorecard, shift-share, typology, drivers, nowcast and forecast models"
requires-python = ">=3.12"
dependencies = [
    "atlas-core",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ml"]
