# Fixed evaluation set for the AI Analyst. Re-run on every prompt or model change:
#   uv run atlas eval
# Checks are resolved against the database at run time, so they stay correct when a
# new data vintage arrives:
#   value:   {district, indicator, period?}  -> answer must contain the DB value (formatted)
#   extreme: {indicator, which: best|worst, period?} -> answer must name that Sabah district
#   mention: [strings]  -> each must appear (case-insensitive)
#   refuse:  true       -> the Analyst must decline (guardrail)
#   no_number_without_citation is always enforced by the validator.

