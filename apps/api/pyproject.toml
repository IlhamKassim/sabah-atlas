[project]
name = "atlas-api"
version = "0.1.0"
description = "Read API and AI Analyst for Atlas Ekonomi Sabah"
requires-python = ">=3.12"
dependencies = [
    "atlas-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "orjson>=3.10",
    "httpx>=0.28",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]
